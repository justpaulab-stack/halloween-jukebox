<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#150d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Haunted Jukebox">
<link rel="manifest" href="manifest.webmanifest">
<title>The Haunted Jukebox</title>
<link rel="stylesheet" href="styles.css?v=4">
<style>
.catalog{margin:14px auto 0;max-width:590px}.catalog[hidden]{display:none}.track-card{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center;padding:12px;border-radius:20px;background:rgba(255,255,255,.95);color:#251436;text-align:left;box-shadow:0 16px 45px rgba(0,0,0,.28)}.track-art{width:86px;height:86px;border-radius:14px;object-fit:cover;box-shadow:0 8px 20px rgba(0,0,0,.18)}.track-title{font-size:18px;font-weight:950;line-height:1.08}.track-artist{margin-top:5px;font-size:15px;font-weight:800;color:#694d75}.track-album{margin-top:3px;font-size:12px;color:#8b738f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-actions{grid-column:1/-1;display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:3px}.track-actions button,.track-actions a{min-height:44px;padding:10px 15px;border-radius:999px;font-weight:950;font-size:13px;text-decoration:none;border:0}.yes-track{background:#251436;color:#fff}.no-track{background:#eee3f2;color:#42244f}.apple-link{background:#f5b550;color:#42152c}.catalog-note{margin-top:8px;font-size:12px;color:#d9cbe2;line-height:1.3}.searching{padding:12px;color:#eadff2;font-weight:800}
@media(max-width:390px){.track-card{grid-template-columns:70px 1fr;gap:10px}.track-art{width:70px;height:70px}.track-title{font-size:16px}.track-actions button,.track-actions a{padding:9px 12px;font-size:12px}}
/* iPad portrait and larger tablets */
@media(min-width:700px){
  .screen{padding:max(42px,env(safe-area-inset-top)) 36px max(36px,env(safe-area-inset-bottom))}
  .doorstage{width:min(520px,72vw)}
  .jukebox{padding:24px 24px 30px;border-radius:56px 56px 38px 38px / 88px 88px 38px 38px}
  .juke-arch{padding:28px 24px 20px}
  .logo{font-size:62px}
  .juke-small{font-size:14px}
  .juke-window{width:290px}
  .chrome-pill{font-size:13px;padding:9px 16px}
  .selector-lights span{width:12px;height:12px}
  .kicker{font-size:23px;margin-bottom:18px}
  .summon{min-height:72px;font-size:18px;border-radius:22px}
  .grille{gap:8px;padding:18px 14px}
  .grille span{height:9px}
  .center{width:min(780px,88vw)}
  .host{width:158px;height:193px;margin-bottom:28px;transform-origin:center}
  .host .eye{top:58px;width:13px;height:18px}.host .eye.l{left:44px}.host .eye.r{right:44px}
  .mouth{top:100px;left:67px;width:24px}
  .bow{bottom:39px;left:53px}
  .bubble{max-width:760px;padding:24px 28px;border-radius:30px;font-size:42px;margin-bottom:26px}
  .inputwrap{max-width:760px;margin:0 auto;padding:13px;border-radius:24px}
  input{font-size:24px;padding:15px 12px}
  .go{font-size:18px;padding:16px 22px;border-radius:18px}
  .choose{min-height:60px;font-size:17px;padding:15px 26px}
  .response{font-size:20px;min-height:54px;max-width:720px}
  .back{font-size:17px;margin-top:18px}
  .catalog{max-width:720px}
  .track-card{padding:18px;border-radius:26px}
  .track-title{font-size:23px}
  .track-artist{font-size:18px}
  .track-actions button,.track-actions a{min-height:52px;font-size:15px;padding:13px 20px}
  .footer{font-size:12px}
}
/* iPad landscape: keep the machine comfortably centred and party-readable */
@media(min-width:900px) and (orientation:landscape){
  .doorstage{width:min(470px,42vw)}
  .jukebox{padding:18px 20px 24px}
  .juke-window{width:230px}
  .logo{font-size:52px}
  .center{width:min(900px,78vw)}
  .host{width:138px;height:168px;margin-bottom:18px}
  .host .eye{top:50px}.host .eye.l{left:39px}.host .eye.r{right:39px}
  .mouth{top:87px;left:59px}.bow{bottom:34px;left:46px}
  .bubble{font-size:36px;max-width:820px;padding:20px 24px;margin-bottom:18px}
  .inputwrap{max-width:820px}
  .catalog{max-width:820px}
}
</style>
</head>
<body>
<div class="app">
  <div class="stars"></div>
  <div class="aura"></div>
  <div class="ghost-layer" aria-hidden="true">
    <div class="ghost g1"><i class="eye l"></i><i class="eye r"></i></div>
    <div class="ghost g2"><i class="eye l"></i><i class="eye r"></i></div>
    <div class="ghost g3"><i class="eye l"></i><i class="eye r"></i></div>
    <div class="ghost g4"><i class="eye l"></i><i class="eye r"></i></div>
    <div class="ghost g5"><i class="eye l"></i><i class="eye r"></i></div>
    <div class="ghost g6"><i class="eye l"></i><i class="eye r"></i></div>
  </div>

  <section id="door" class="screen active" aria-label="Haunted Jukebox entrance">
    <div class="doorstage">
      <div class="jukebox" aria-label="A glowing 1950s style haunted jukebox">
        <div class="juke-arch">
          <div class="lightbar left" aria-hidden="true"></div>
          <div class="lightbar right" aria-hidden="true"></div>
          <div class="arc-glow" aria-hidden="true"></div>
          <div class="juke-title">
            <div class="juke-small">Wurlitzer after dark</div>
            <div class="logo">The Haunted<br>Jukebox</div>
          </div>
          <div class="juke-window" aria-hidden="true"><div class="record-label">45</div></div>
        </div>
        <div class="selector-panel">
          <div class="chrome-pill">Host selector • B7</div>
          <div class="selector-lights" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
          <div class="kicker">The host is hovering nearby.</div>
          <button id="summon" class="summon" type="button">Tap to summon the host</button>
        </div>
        <div class="grille" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </section>

  <section id="entry" class="screen" aria-label="Song request">
    <div class="center">
      <div class="host" aria-hidden="true"><i class="eye l"></i><i class="eye r"></i><span class="mouth"></span><span class="bow"></span></div>
      <div class="bubble" id="greeting">Darling, where have you been?</div>
      <form id="requestForm" class="inputwrap">
        <input id="request" autocomplete="off" autocapitalize="words" enterkeyhint="go" placeholder="Type a song or artist…" aria-label="Song request">
        <button class="go" type="submit">Ask</button>
      </form>
      <div class="pickrow"><button id="youChoose" class="choose" type="button">YOU CHOOSE</button></div>
      <div id="response" class="response">Choose a song, or let me choose for you, darling.</div>
      <div id="catalog" class="catalog" hidden></div>
      <button id="back" class="back" type="button">Return to the door</button>
    </div>
  </section>

  <div class="footer">HAUNTED JUKEBOX • IPHONE + IPAD PROTOTYPE</div>
</div>
<script src="app.js?v=7"></script>
</body>
</html>
